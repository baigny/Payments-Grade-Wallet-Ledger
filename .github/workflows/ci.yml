name: checks
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Build and test
        run: docker compose --profile test run --build --rm test
      - name: Lint
        run: |
          docker compose run --no-deps --rm test ruff check wallet tests scripts
          docker compose run --no-deps --rm test ruff format --check wallet tests scripts
      - name: Verify API exports
        run: docker compose run --no-deps --rm test python scripts/export_api.py --check
      - name: Smoke test application startup
        run: |
          docker compose up --build --wait api worker
          curl --fail http://localhost:8000/health/ready
          curl --fail --silent http://localhost:8000/openapi.json > /dev/null
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run Postman collection
        run: python scripts/run_postman.py
      - name: Capture two-psql-process isolation lab
        run: python scripts/psql_lab.py --output /tmp/isolation.md
      - name: Run isolated lightweight network smoke test
        run: python scripts/run_network_checks.py --output /tmp/network-smoke.json
      - name: Logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop services
        if: always()
        run: docker compose down --volumes
